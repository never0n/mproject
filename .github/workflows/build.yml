name: Desktop prototype

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libvulkan-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Package assets beside executable
        shell: pwsh
        run: Copy-Item -Recurse assets target/debug/assets
      - uses: actions/upload-artifact@v4
        with:
          name: mortown-${{ runner.os }}
          path: |
            target/debug/mortown-client
            target/debug/mortown-client.exe
            target/debug/mortown-server
            target/debug/mortown-server.exe
            compose.yaml
            target/debug/assets/**

  network:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mortown
          POSTGRES_PASSWORD: mortown_ci
          POSTGRES_DB: mortown
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mortown -d mortown"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mortown-server --test network --locked -- --ignored
        env:
          TEST_DATABASE_URL: postgres://mortown:mortown_ci@127.0.0.1:5432/mortown
