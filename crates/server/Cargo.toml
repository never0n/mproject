[package]
name = "mortown-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
[dependencies]
mortown-world = { path = "../world" }
mortown-protocol = { path = "../protocol" }
bevy_ecs = "=0.18.1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
futures-util = "0.3"
[dev-dependencies]
tokio-tungstenite = "0.28"
